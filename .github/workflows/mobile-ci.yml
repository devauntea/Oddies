name: Mobile CI

# Checks for the Expo app in /mobile. Separate from the web app's Fly deploy workflow.
# The app also bundles the shared art and layout in /assets, so changes there are checked too.
on:
  pull_request:
    paths: ['mobile/**', 'assets/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['mobile/**', 'assets/**', '.github/workflows/mobile-ci.yml']

concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: mobile/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test -- --ci
